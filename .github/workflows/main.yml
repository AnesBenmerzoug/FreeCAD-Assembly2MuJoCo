name: Main CI Workflow

on:
  pull_request:
    branches:
    - main
    - dev
  push:
    branches:
    - main
    - dev
  workflow_dispatch:
    inputs:
      reason:
        description: Why did you trigger the pipeline?
        required: False
        default: Check if it runs again due to external changes

env:
  GITHUB_BOT_USERNAME: github-actions[bot]
  GITHUB_BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PY_COLORS: 1
  PYTHON_VERSION: '3.11'
  FREECAD_VERSION: '1.0.2'

defaults:
  run:
    shell: bash -el {0}

jobs:
  code-quality:
    name: Lint and format code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Virtual Environment
      uses: ./.github/actions/python
      with:
        python_version: ${{ env.PYTHON_VERSION }}
        freecad_version: ${{ env.FREECAD_VERSION }}
    - name: Run pre-commit
      run: pre-commit run --all-files --verbose --show-diff-on-failure
    - name: Add mypy PR annotator
      uses: pr-annotators/mypy-pr-annotator@v1.0.0
    - name: Run mypy
      run: mypy freecad/
      continue-on-error: true
    - name: Generate Job Summary
      if: always()
      run: |
        echo "# Code Quality Results 🔍" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Version:** ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **FreeCAD Version:** ${{ env.FREECAD_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.precommit.outcome }}" == "success" ]; then
          echo "✅ **Pre-commit checks:** Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Pre-commit checks:** Failed" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ steps.mypy.outcome }}" == "success" ]; then
          echo "✅ **MyPy type checking:** Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **MyPy type checking:** Failed (non-blocking)" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Workflow triggered by: ${{ github.event_name }}*" >> $GITHUB_STEP_SUMMARY
