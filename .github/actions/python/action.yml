ame: Setup Python Environment

inputs:
  python_version:
    required: true
    type: string

runs:
  using: "composite"
  steps:
  - name: Setup and Cache Conda Environment with FreeCAD
    uses: mamba-org/setup-micromamba@v2
    with:
      environment-file: environment.yml
      init-shell: >-
        bash
        powershell
      cache-environment: true
      post-cleanup: 'all'
